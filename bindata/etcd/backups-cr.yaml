kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: system:openshift:operator:etcd-backup-role
rules:
  - apiGroups:
      - ""
    resources:
      - "nodes"
    verbs:
      - "list"
  - apiGroups:
      - "operator.openshift.io"
    resources:
      - "etcdbackups"
    verbs:
      - "list"
      - "create"
  - apiGroups:
      - "operator.openshift.io"
    resources:
      - "etcdbackuppolicies"
    verbs:
      - "get"
