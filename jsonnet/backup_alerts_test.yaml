# promtool rule unit tests for backup alerts.
# Uses realistic scrape labels (job/instance) to catch default vector-matching bugs.
#
# Duplicate-target and rollout groups model more than one operator pod exporting
# the same objects: every target exports each series the collectors would export
# for the objects in the scenario. That means etcd_backup_info, all three
# etcd_backup_status series (at most one is 1), the creation timestamp, the
# completion timestamp once a backup has finished, and the policy creation
# timestamp and schedule interval. The only exceptions are deliberate: missing
# intervals, cache skew (including a backup observed by only one pod), rollout
# start/stop windows and recreated UIDs. etcd_backup_policy_info and
# etcd_backup_size_bytes are omitted because no rule reads them.
#
# Run via: hack/test-backup-alerts.sh
rule_files:
  - backup_alerts_rules_for_test.yaml
evaluation_interval: 1m

tests:
  # Duration alert for a Running backup: matches status and creation series on
  # backup identity. Alert labels are the backup identity (etcd_backup, uid, plus
  # namespace when present); scrape-target labels and the status label are dropped.
  # In promtool tests, time() equals eval_time seconds from epoch 0.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x40"
    alert_rule_test:
      # time()=2400 at 40m; creation_time=0 → age>1800 since ~31m; for:5m → firing by 40m.
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" has been running for longer than expected (30 minutes). This may indicate storage performance issues or an issue with the backup process.'

  # Threshold and hold: age must exceed 1800s (true from 31m), then the alert is
  # pending for 5m and fires at 36m.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: etcdBackupDurationHigh
        exp_alerts: []
      - eval_time: 35m
        alertname: etcdBackupDurationHigh
        exp_alerts: []
      - eval_time: 36m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" has been running for longer than expected (30 minutes). This may indicate storage performance issues or an issue with the backup process.'

  # Duplicate scrape targets export the same Running backup: one alert per
  # (etcd_backup, uid), without per-target labels.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x40"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" has been running for longer than expected (30 minutes). This may indicate storage performance issues or an issue with the backup process.'

  # Rollout overlap: the outgoing pod's series stop (stale) at 46m and the
  # incoming pod's series start at 44m. The alert keeps the same identity, so it
  # stays firing at 47m instead of restarting the 5m hold for the new pod.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x45 stale"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x45 stale"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "_x44 0+0x16"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "_x44 1+0x16"
    alert_rule_test:
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" has been running for longer than expected (30 minutes). This may indicate storage performance issues or an issue with the backup process.'
      - eval_time: 47m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" has been running for longer than expected (30 minutes). This may indicate storage performance issues or an issue with the backup process.'

  # Running -> Completed at 45m after a slow run: the alert fires while Running and
  # clears once Completed is observed. A slow backup that has finished does not
  # keep the alert firing (checked well after the hold at 90m).
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x90"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x44 0+0x45"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Completed"}'
        values: "0+0x44 1+0x45"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Failed"}'
        values: "0+0x90"
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "_x45 2700+0x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" has been running for longer than expected (30 minutes). This may indicate storage performance issues or an issue with the backup process.'
      - eval_time: 45m
        alertname: etcdBackupDurationHigh
        exp_alerts: []
      - eval_time: 90m
        alertname: etcdBackupDurationHigh
        exp_alerts: []

  # Running -> Failed at 45m after a slow run: the alert fires while Running and
  # clears once Failed is observed. A slow backup that has finished does not
  # keep the alert firing (checked well after the hold at 90m).
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x90"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x44 0+0x45"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Failed"}'
        values: "0+0x44 1+0x45"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Completed"}'
        values: "0+0x90"
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "_x45 2700+0x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" has been running for longer than expected (30 minutes). This may indicate storage performance issues or an issue with the backup process.'
      - eval_time: 45m
        alertname: etcdBackupDurationHigh
        exp_alerts: []
      - eval_time: 90m
        alertname: etcdBackupDurationHigh
        exp_alerts: []

  # Exporter cache skew: the outgoing pod's cache still shows backup-1 and
  # backup-2 as Running while the incoming pod already reports backup-1
  # Completed and backup-2 Failed from 40m. Completed and Failed replace Running,
  # so each alert clears once any exporter reports the terminal status.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Completed"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Failed"}'
        values: "0+0x60"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "_x40 0+0x20"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "_x40 0+0x20"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1",status="Completed"}'
        values: "_x40 1+0x20"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1",status="Failed"}'
        values: "_x40 0+0x20"
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "_x40 2400+0x20"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2",status="Running"}'
        values: "1+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2",status="Failed"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2",status="Completed"}'
        values: "0+0x60"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-2",uid="backup-uid-2"}'
        values: "_x40 0+0x20"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-2",uid="backup-uid-2",status="Running"}'
        values: "_x40 0+0x20"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-2",uid="backup-uid-2",status="Failed"}'
        values: "_x40 1+0x20"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-2",uid="backup-uid-2",status="Completed"}'
        values: "_x40 0+0x20"
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-2",uid="backup-uid-2"}'
        values: "_x40 2400+0x20"
    alert_rule_test:
      - eval_time: 38m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" has been running for longer than expected (30 minutes). This may indicate storage performance issues or an issue with the backup process.'
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-2
              uid: backup-uid-2
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-2" has been running for longer than expected (30 minutes). This may indicate storage performance issues or an issue with the backup process.'
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts: []

  # Zero-valued Running is not active: backup-1 has no lifecycle status yet (all
  # status series 0) and backup-2 completed quickly; both are older than 1800s.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Completed"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Failed"}'
        values: "0+0x40"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2",status="Running"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2",status="Completed"}'
        values: "1+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2",status="Failed"}'
        values: "0+0x40"
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2"}'
        values: "600+0x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts: []

  # Distinct backups with duplicate scrape targets are evaluated independently:
  # backup-a (created 0s) fires by 40m; backup-b (created 1200s) exceeds 1800s at
  # 51m and fires from 56m.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-a",uid="backup-uid-a"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-a",uid="backup-uid-a",status="Running"}'
        values: "1+0x60"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-b",uid="backup-uid-b"}'
        values: "_x20 1200+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-b",uid="backup-uid-b",status="Running"}'
        values: "_x20 1+0x40"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-a",uid="backup-uid-a"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-a",uid="backup-uid-a",status="Running"}'
        values: "1+0x60"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-b",uid="backup-uid-b"}'
        values: "_x20 1200+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-b",uid="backup-uid-b",status="Running"}'
        values: "_x20 1+0x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-a
              uid: backup-uid-a
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-a" has been running for longer than expected (30 minutes). This may indicate storage performance issues or an issue with the backup process.'
      - eval_time: 55m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-a
              uid: backup-uid-a
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-a" has been running for longer than expected (30 minutes). This may indicate storage performance issues or an issue with the backup process.'
      - eval_time: 56m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-a
              uid: backup-uid-a
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-a" has been running for longer than expected (30 minutes). This may indicate storage performance issues or an issue with the backup process.'
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-b
              uid: backup-uid-b
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-b" has been running for longer than expected (30 minutes). This may indicate storage performance issues or an issue with the backup process.'

  # Recreated backup reusing a name: a lagging exporter still reports the old
  # object (backup-uid-1) as Completed while the other exporter reports the new
  # object (backup-uid-2, created at 600s) as Running. Matching on uid keeps the
  # new object alerting once it exceeds 1800s at 41m (fires from 46m).
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Completed"}'
        values: "1+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Failed"}'
        values: "0+0x60"
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "300+0x60"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-2"}'
        values: "_x10 600+0x50"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-2",status="Running"}'
        values: "_x10 1+0x50"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-2",status="Completed"}'
        values: "_x10 0+0x50"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-2",status="Failed"}'
        values: "_x10 0+0x50"
    alert_rule_test:
      - eval_time: 45m
        alertname: etcdBackupDurationHigh
        exp_alerts: []
      - eval_time: 50m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-2
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" has been running for longer than expected (30 minutes). This may indicate storage performance issues or an issue with the backup process.'

  # Never-succeeded daily policy: age must exceed 2*interval (48h) before firing.
  # NoRecentSuccess labels are the policy identity (etcd_backup_policy, uid) plus
  # namespace when present; per-target labels (job, instance, pod) are dropped
  # by deduplication so overlapping targets yield a single alert.
  - interval: 1h
    input_series:
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "1+0x55"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "86400+0x55"
    alert_rule_test:
      # At 26h age < 2*daily (48h) → silent.
      - eval_time: 26h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts: []
      # At 50h age > 48h → fire.
      - eval_time: 50h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: critical
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within two schedule intervals.
              description: 'Backup policy "daily" has not completed a successful backup within two schedule intervals. This is a critical issue that may prevent disaster recovery.'
              runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-etcd-operator/etcdBackupPolicyNoRecentSuccess.md

  # Recent Completed backup suppresses NoRecentSuccess for an old policy.
  - interval: 1h
    input_series:
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "1+0x55"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "86400+0x55"
      - series: 'etcd_backup_info{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",etcd_backup_policy="daily",node="master-0",storage_type="PVC",storage_location="backup-pvc"}'
        values: "1+0x55"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",status="Completed"}'
        values: "1+0x55"
      # completion near the end of the series window (≈49h) so age at 50h is ~1h.
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1"}'
        values: "176400+0x55"
    alert_rule_test:
      - eval_time: 50h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts: []

  # Stale Completed backup: last success older than 2*interval → fire.
  - interval: 1h
    input_series:
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "1+0x55"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "86400+0x55"
      - series: 'etcd_backup_info{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",etcd_backup_policy="daily",node="master-0",storage_type="PVC",storage_location="backup-pvc"}'
        values: "1+0x55"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",status="Completed"}'
        values: "1+0x55"
      # success at t=100s; at 50h age ≈50h > 48h threshold.
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1"}'
        values: "100+0x55"
    alert_rule_test:
      - eval_time: 50h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: critical
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within two schedule intervals.
              description: 'Backup policy "daily" has not completed a successful backup within two schedule intervals. This is a critical issue that may prevent disaster recovery.'
              runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-etcd-operator/etcdBackupPolicyNoRecentSuccess.md

  # Weekly policy (interval=7d): at 13d still within 2*interval (14d); at 15d fires.
  - interval: 12h
    input_series:
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="weekly",uid="uid-2"}'
        values: "1+0x35"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="weekly",uid="uid-2"}'
        values: "604800+0x35"
    alert_rule_test:
      - eval_time: 312h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts: []
      - eval_time: 360h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: critical
              etcd_backup_policy: weekly
              uid: uid-2
            exp_annotations:
              summary: Backup policy has no successful backup within two schedule intervals.
              description: 'Backup policy "weekly" has not completed a successful backup within two schedule intervals. This is a critical issue that may prevent disaster recovery.'
              runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-etcd-operator/etcdBackupPolicyNoRecentSuccess.md

  # Duplicate targets: two operator pods export the same policy (same UID) while
  # both are visible in the lookback window. Joins must deduplicate by logical
  # object instead of failing with many-to-many / duplicate-series errors, and
  # the policy must alert once (not once per target). Backup b1 starts at 49h and
  # is still Running (no completion timestamp), so it is not a success.
  - interval: 1h
    input_series:
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup_policy="daily",uid="uid-1"}'
        values: "1+0x55"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup_policy="daily",uid="uid-1"}'
        values: "86400+0x55"
      - series: 'etcd_backup_info{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="b1",uid="b-uid-1",etcd_backup_policy="daily",node="master-0",storage_type="PVC",storage_location="backup-pvc"}'
        values: "_x49 1+0x6"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="b1",uid="b-uid-1",status="Running"}'
        values: "_x49 1+0x6"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="b1",uid="b-uid-1",status="Completed"}'
        values: "_x49 0+0x6"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="b1",uid="b-uid-1",status="Failed"}'
        values: "_x49 0+0x6"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="b1",uid="b-uid-1"}'
        values: "_x49 176400+0x6"
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup_policy="daily",uid="uid-1"}'
        values: "1+0x55"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup_policy="daily",uid="uid-1"}'
        values: "86400+0x55"
      - series: 'etcd_backup_info{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="b1",uid="b-uid-1",etcd_backup_policy="daily",node="master-0",storage_type="PVC",storage_location="backup-pvc"}'
        values: "_x49 1+0x6"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="b1",uid="b-uid-1",status="Running"}'
        values: "_x49 1+0x6"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="b1",uid="b-uid-1",status="Completed"}'
        values: "_x49 0+0x6"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="b1",uid="b-uid-1",status="Failed"}'
        values: "_x49 0+0x6"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="b1",uid="b-uid-1"}'
        values: "_x49 176400+0x6"
    alert_rule_test:
      - eval_time: 26h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts: []
      - eval_time: 50h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: openshift-etcd-operator
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within two schedule intervals.
              description: 'Backup policy "daily" has not completed a successful backup within two schedule intervals. This is a critical issue that may prevent disaster recovery.'
              runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-etcd-operator/etcdBackupPolicyNoRecentSuccess.md

  # Rollout overlap: the outgoing pod's series stop (stale) at 52h, the incoming
  # pod's series start at 46h. The alert evaluates during the overlap and keeps
  # the same identity once only the new pod reports. Backup b1 starts at 49h and
  # is still Running on both pods, so it is not a success.
  - interval: 1h
    input_series:
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-old",etcd_backup_policy="daily",uid="uid-1"}'
        values: "1+0x51 stale"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-old",etcd_backup_policy="daily",uid="uid-1"}'
        values: "86400+0x51 stale"
      - series: 'etcd_backup_info{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-old",etcd_backup="b1",uid="b-uid-1",etcd_backup_policy="daily",node="master-0",storage_type="PVC",storage_location="backup-pvc"}'
        values: "_x49 1+0x2 stale"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-old",etcd_backup="b1",uid="b-uid-1",status="Running"}'
        values: "_x49 1+0x2 stale"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-old",etcd_backup="b1",uid="b-uid-1",status="Completed"}'
        values: "_x49 0+0x2 stale"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-old",etcd_backup="b1",uid="b-uid-1",status="Failed"}'
        values: "_x49 0+0x2 stale"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-old",etcd_backup="b1",uid="b-uid-1"}'
        values: "_x49 176400+0x2 stale"
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-new",etcd_backup_policy="daily",uid="uid-1"}'
        values: "_x46 1+0x9"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-new",etcd_backup_policy="daily",uid="uid-1"}'
        values: "_x46 86400+0x9"
      - series: 'etcd_backup_info{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-new",etcd_backup="b1",uid="b-uid-1",etcd_backup_policy="daily",node="master-0",storage_type="PVC",storage_location="backup-pvc"}'
        values: "_x49 1+0x6"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-new",etcd_backup="b1",uid="b-uid-1",status="Running"}'
        values: "_x49 1+0x6"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-new",etcd_backup="b1",uid="b-uid-1",status="Completed"}'
        values: "_x49 0+0x6"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-new",etcd_backup="b1",uid="b-uid-1",status="Failed"}'
        values: "_x49 0+0x6"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-new",etcd_backup="b1",uid="b-uid-1"}'
        values: "_x49 176400+0x6"
    alert_rule_test:
      # Overlap, age < 48h → silent.
      - eval_time: 47h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts: []
      # Overlap, age > 48h → one alert.
      - eval_time: 50h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: openshift-etcd-operator
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within two schedule intervals.
              description: 'Backup policy "daily" has not completed a successful backup within two schedule intervals. This is a critical issue that may prevent disaster recovery.'
              runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-etcd-operator/etcdBackupPolicyNoRecentSuccess.md
      # Only the new pod reports → same alert identity.
      - eval_time: 54h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: openshift-etcd-operator
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within two schedule intervals.
              description: 'Backup policy "daily" has not completed a successful backup within two schedule intervals. This is a critical issue that may prevent disaster recovery.'
              runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-etcd-operator/etcdBackupPolicyNoRecentSuccess.md

