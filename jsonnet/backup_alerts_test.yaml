# promtool rule unit tests for backup alerts.
# Uses realistic scrape labels (job/instance) to catch default vector-matching bugs.
#
# Run via: hack/test-backup-alerts.sh
rule_files:
  - backup_alerts_rules_for_test.yaml
evaluation_interval: 1m

tests:
  # Running-branch duration alert: status has an extra status label; must match on backup identity.
  # In promtool tests, time() equals eval_time seconds from epoch 0.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_start_time{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x40"
    alert_rule_test:
      # time()=2400 at 40m; start_time=0 → age>1800 since ~31m; for:5m → firing by 40m.
      # Expected labels include status from the left-hand Running series.
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: cluster-etcd-operator
              instance: "10.0.0.1:9090"
              etcd_backup: backup-1
              uid: backup-uid-1
              status: Running
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" has been running for longer than expected (30 minutes). This may indicate storage performance issues or an issue with the backup process.'

  # Never-succeeded daily policy: age must exceed 2*interval (48h) before firing.
  - interval: 1h
    input_series:
      - series: 'etcd_backup_policy_creation_time{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "1+0x55"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "86400+0x55"
    alert_rule_test:
      # At 26h age < 2*daily (48h) → silent.
      - eval_time: 26h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts: []
      # At 50h age > 48h → fire.
      - eval_time: 50h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: critical
              job: cluster-etcd-operator
              instance: "10.0.0.1:9090"
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within two schedule intervals.
              description: 'Backup policy "daily" has not completed a successful backup within two schedule intervals. This is a critical issue that may prevent disaster recovery.'
              runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-etcd-operator/etcdBackupPolicyNoRecentSuccess.md

  # Recent Completed backup suppresses NoRecentSuccess for an old policy.
  - interval: 1h
    input_series:
      - series: 'etcd_backup_policy_creation_time{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "1+0x55"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "86400+0x55"
      - series: 'etcd_backup_info{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",etcd_backup_policy="daily",node="master-0",storage_type="PVC",storage_location="backup-pvc"}'
        values: "1+0x55"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",status="Completed"}'
        values: "1+0x55"
      # completion near the end of the series window (≈49h) so age at 50h is ~1h.
      - series: 'etcd_backup_completion_time{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1"}'
        values: "176400+0x55"
    alert_rule_test:
      - eval_time: 50h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts: []

  # Stale Completed backup: last success older than 2*interval → fire.
  - interval: 1h
    input_series:
      - series: 'etcd_backup_policy_creation_time{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "1+0x55"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "86400+0x55"
      - series: 'etcd_backup_info{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",etcd_backup_policy="daily",node="master-0",storage_type="PVC",storage_location="backup-pvc"}'
        values: "1+0x55"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",status="Completed"}'
        values: "1+0x55"
      # success at t=100s; at 50h age ≈50h > 48h threshold.
      - series: 'etcd_backup_completion_time{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1"}'
        values: "100+0x55"
    alert_rule_test:
      - eval_time: 50h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: critical
              job: cluster-etcd-operator
              instance: "10.0.0.1:9090"
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within two schedule intervals.
              description: 'Backup policy "daily" has not completed a successful backup within two schedule intervals. This is a critical issue that may prevent disaster recovery.'
              runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-etcd-operator/etcdBackupPolicyNoRecentSuccess.md

  # Weekly policy (interval=7d): at 13d still within 2*interval (14d); at 15d fires.
  - interval: 12h
    input_series:
      - series: 'etcd_backup_policy_creation_time{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="weekly",uid="uid-2"}'
        values: "1+0x35"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="weekly",uid="uid-2"}'
        values: "604800+0x35"
    alert_rule_test:
      - eval_time: 312h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts: []
      - eval_time: 360h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: critical
              job: cluster-etcd-operator
              instance: "10.0.0.1:9090"
              etcd_backup_policy: weekly
              uid: uid-2
            exp_annotations:
              summary: Backup policy has no successful backup within two schedule intervals.
              description: 'Backup policy "weekly" has not completed a successful backup within two schedule intervals. This is a critical issue that may prevent disaster recovery.'
              runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-etcd-operator/etcdBackupPolicyNoRecentSuccess.md
