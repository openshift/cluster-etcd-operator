  # UID while the new pod exports the new UID. Backups associate with policies
  # by name, so a recent Completed backup suppresses both UIDs; matching by name
  # must not fail because two policy UIDs share it. Only the incoming pod has
  # observed backup b1, so the old UID is suppressed by another target's backup.
