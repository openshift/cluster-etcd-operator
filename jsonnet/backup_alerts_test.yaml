        values: "100+0x55"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="b4",uid="b-uid-4",status="Running"}'
