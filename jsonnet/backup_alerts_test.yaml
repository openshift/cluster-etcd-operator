# promtool rule unit tests for backup alerts.
# Uses realistic scrape labels (job/instance) to catch default vector-matching bugs.
#
# Duplicate-target and rollout groups model more than one operator pod exporting
# the same objects: every target exports each series the collectors would export
# for the objects in the scenario. That means etcd_backup_info, all three
# etcd_backup_status series (at most one is 1), the creation timestamp, the
# completion timestamp once a backup has finished, and the policy creation
# timestamp and schedule interval. The only exceptions are deliberate: missing
# intervals, cache skew (including a backup observed by only one pod), rollout
# start/stop windows and recreated UIDs. etcd_backup_policy_info and
# etcd_backup_size_bytes are omitted because no rule reads them.
#
# Run via: hack/test-backup-alerts.sh
rule_files:
  - backup_alerts_rules_for_test.yaml
evaluation_interval: 1m

tests:
  # Duration alert for a Running backup: matches status and creation series on
  # backup identity. Alert labels are the backup identity (etcd_backup, uid) and
  # the static namespace label; scrape-target labels and the status label are
  # dropped.
  # In promtool tests, time() equals eval_time seconds from epoch 0.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x40"
    alert_rule_test:
      # time()=2400 at 40m; creation_time=0 → age>1800 since ~31m; for:5m → firing by 40m.
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" is still running 40m 0s after it was created, longer than expected (30 minutes). This time is measured from the creation of the EtcdBackup object and includes any time the backup spent queued before it started running. This may indicate storage performance issues or an issue with the backup process.'

  # Threshold and hold: age must exceed 1800s (true from 31m), then the alert is
  # pending for 5m and fires at 36m.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: etcdBackupDurationHigh
        exp_alerts: []
      - eval_time: 35m
        alertname: etcdBackupDurationHigh
        exp_alerts: []
      - eval_time: 36m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" is still running 36m 0s after it was created, longer than expected (30 minutes). This time is measured from the creation of the EtcdBackup object and includes any time the backup spent queued before it started running. This may indicate storage performance issues or an issue with the backup process.'

  # Duplicate scrape targets export the same Running backup: one alert per
  # (etcd_backup, uid), without per-target labels.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x40"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" is still running 40m 0s after it was created, longer than expected (30 minutes). This time is measured from the creation of the EtcdBackup object and includes any time the backup spent queued before it started running. This may indicate storage performance issues or an issue with the backup process.'

  # Rollout overlap: the outgoing pod's series stop (stale) at 46m and the
  # incoming pod's series start at 44m. The alert keeps the same identity, so it
  # stays firing at 47m instead of restarting the 5m hold for the new pod.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x45 stale"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x45 stale"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "_x44 0+0x16"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "_x44 1+0x16"
    alert_rule_test:
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" is still running 40m 0s after it was created, longer than expected (30 minutes). This time is measured from the creation of the EtcdBackup object and includes any time the backup spent queued before it started running. This may indicate storage performance issues or an issue with the backup process.'
      - eval_time: 47m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" is still running 47m 0s after it was created, longer than expected (30 minutes). This time is measured from the creation of the EtcdBackup object and includes any time the backup spent queued before it started running. This may indicate storage performance issues or an issue with the backup process.'

  # Running -> Completed at 45m after a slow run: the alert fires while Running and
  # clears once Completed is observed. A slow backup that has finished does not
  # keep the alert firing (checked well after the hold at 90m).
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x90"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x44 0+0x45"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Completed"}'
        values: "0+0x44 1+0x45"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Failed"}'
        values: "0+0x90"
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "_x45 2700+0x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" is still running 40m 0s after it was created, longer than expected (30 minutes). This time is measured from the creation of the EtcdBackup object and includes any time the backup spent queued before it started running. This may indicate storage performance issues or an issue with the backup process.'
      - eval_time: 45m
        alertname: etcdBackupDurationHigh
        exp_alerts: []
      - eval_time: 90m
        alertname: etcdBackupDurationHigh
        exp_alerts: []

  # Running -> Failed at 45m after a slow run: the alert fires while Running and
  # clears once Failed is observed. A slow backup that has finished does not
  # keep the alert firing (checked well after the hold at 90m).
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x90"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x44 0+0x45"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Failed"}'
        values: "0+0x44 1+0x45"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Completed"}'
        values: "0+0x90"
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "_x45 2700+0x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" is still running 40m 0s after it was created, longer than expected (30 minutes). This time is measured from the creation of the EtcdBackup object and includes any time the backup spent queued before it started running. This may indicate storage performance issues or an issue with the backup process.'
      - eval_time: 45m
        alertname: etcdBackupDurationHigh
        exp_alerts: []
      - eval_time: 90m
        alertname: etcdBackupDurationHigh
        exp_alerts: []

  # Exporter cache skew: the outgoing pod's cache still shows backup-1 and
  # backup-2 as Running while the incoming pod already reports backup-1
  # Completed and backup-2 Failed from 40m. Completed and Failed replace Running,
  # so each alert clears once any exporter reports the terminal status.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Completed"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Failed"}'
        values: "0+0x60"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "_x40 0+0x20"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "_x40 0+0x20"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1",status="Completed"}'
        values: "_x40 1+0x20"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1",status="Failed"}'
        values: "_x40 0+0x20"
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "_x40 2400+0x20"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2",status="Running"}'
        values: "1+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2",status="Failed"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2",status="Completed"}'
        values: "0+0x60"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-2",uid="backup-uid-2"}'
        values: "_x40 0+0x20"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-2",uid="backup-uid-2",status="Running"}'
        values: "_x40 0+0x20"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-2",uid="backup-uid-2",status="Failed"}'
        values: "_x40 1+0x20"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-2",uid="backup-uid-2",status="Completed"}'
        values: "_x40 0+0x20"
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-2",uid="backup-uid-2"}'
        values: "_x40 2400+0x20"
    alert_rule_test:
      - eval_time: 38m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" is still running 38m 0s after it was created, longer than expected (30 minutes). This time is measured from the creation of the EtcdBackup object and includes any time the backup spent queued before it started running. This may indicate storage performance issues or an issue with the backup process.'
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-2
              uid: backup-uid-2
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-2" is still running 38m 0s after it was created, longer than expected (30 minutes). This time is measured from the creation of the EtcdBackup object and includes any time the backup spent queued before it started running. This may indicate storage performance issues or an issue with the backup process.'
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts: []

  # Zero-valued Running is not active: backup-1 has no lifecycle status yet (all
  # status series 0) and backup-2 completed quickly; both are older than 1800s.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Completed"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Failed"}'
        values: "0+0x40"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2",status="Running"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2",status="Completed"}'
        values: "1+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2",status="Failed"}'
        values: "0+0x40"
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-2",uid="backup-uid-2"}'
        values: "600+0x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts: []

  # Distinct backups with duplicate scrape targets are evaluated independently:
  # backup-a (created 0s) fires by 40m; backup-b (created 1200s) exceeds 1800s at
  # 51m and fires from 56m.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-a",uid="backup-uid-a"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-a",uid="backup-uid-a",status="Running"}'
        values: "1+0x60"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-b",uid="backup-uid-b"}'
        values: "_x20 1200+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-b",uid="backup-uid-b",status="Running"}'
        values: "_x20 1+0x40"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-a",uid="backup-uid-a"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-a",uid="backup-uid-a",status="Running"}'
        values: "1+0x60"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-b",uid="backup-uid-b"}'
        values: "_x20 1200+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-b",uid="backup-uid-b",status="Running"}'
        values: "_x20 1+0x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-a
              uid: backup-uid-a
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-a" is still running 40m 0s after it was created, longer than expected (30 minutes). This time is measured from the creation of the EtcdBackup object and includes any time the backup spent queued before it started running. This may indicate storage performance issues or an issue with the backup process.'
      - eval_time: 55m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-a
              uid: backup-uid-a
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-a" is still running 55m 0s after it was created, longer than expected (30 minutes). This time is measured from the creation of the EtcdBackup object and includes any time the backup spent queued before it started running. This may indicate storage performance issues or an issue with the backup process.'
      - eval_time: 56m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-a
              uid: backup-uid-a
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-a" is still running 56m 0s after it was created, longer than expected (30 minutes). This time is measured from the creation of the EtcdBackup object and includes any time the backup spent queued before it started running. This may indicate storage performance issues or an issue with the backup process.'
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-b
              uid: backup-uid-b
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-b" is still running 36m 0s after it was created, longer than expected (30 minutes). This time is measured from the creation of the EtcdBackup object and includes any time the backup spent queued before it started running. This may indicate storage performance issues or an issue with the backup process.'

  # Recreated backup reusing a name: a lagging exporter still reports the old
  # object (backup-uid-1) as Completed while the other exporter reports the new
  # object (backup-uid-2, created at 600s) as Running. Matching on uid keeps the
  # new object alerting once it exceeds 1800s at 41m (fires from 46m).
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "0+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Completed"}'
        values: "1+0x60"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Failed"}'
        values: "0+0x60"
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "300+0x60"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-2"}'
        values: "_x10 600+0x50"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-2",status="Running"}'
        values: "_x10 1+0x50"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-2",status="Completed"}'
        values: "_x10 0+0x50"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-2",status="Failed"}'
        values: "_x10 0+0x50"
    alert_rule_test:
      - eval_time: 45m
        alertname: etcdBackupDurationHigh
        exp_alerts: []
      - eval_time: 50m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-2
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" is still running 40m 0s after it was created, longer than expected (30 minutes). This time is measured from the creation of the EtcdBackup object and includes any time the backup spent queued before it started running. This may indicate storage performance issues or an issue with the backup process.'

  # The namespace label is static, not taken from the scrape target: one exporter
  # reports a namespace label and the other none, and the backup still alerts
  # once with namespace openshift-etcd-operator.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x40"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1"}'
        values: "0+0x40"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup="backup-1",uid="backup-uid-1",status="Running"}'
        values: "1+0x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: etcdBackupDurationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup: backup-1
              uid: backup-uid-1
            exp_annotations:
              summary: etcd backup duration is high.
              description: 'etcd backup "backup-1" is still running 40m 0s after it was created, longer than expected (30 minutes). This time is measured from the creation of the EtcdBackup object and includes any time the backup spent queued before it started running. This may indicate storage performance issues or an issue with the backup process.'

  # etcdBackupPolicyNoRecentSuccess is info once the time since the latest visible
  # Completed backup (or the policy creation, if there is none) exceeds one
  # schedule interval and warning once it exceeds two. The severities are
  # independent, so past two intervals both fire. Each has its own 5m hold, so
  # these groups sample every minute (a sample is only visible for 5m, so hourly
  # samples could never satisfy the hold). The descriptions show that elapsed
  # time. The backup alerts carry a static namespace label; the series here have
  # none.

  # Never-succeeded daily policy, measured from the policy creation (t=1s). Info:
  # age exceeds 1*interval (86400s) from 24h01m and fires after the 5m hold at
  # 24h06m. Warning: age exceeds 2*interval (172800s) from 48h01m and fires after
  # its own 5m hold at 48h06m. Info keeps firing, so both fire from 48h06m.
  # NoRecentSuccess labels are the policy identity (etcd_backup_policy, uid) plus
  # the static namespace; per-target labels (job, instance, pod) are dropped by
  # deduplication so overlapping targets yield a single alert.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "1+0x3000"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "86400+0x3000"
    alert_rule_test:
      # Age 86399s, not above 1*interval → silent.
      - eval_time: 24h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts: []
      # Info condition since 24h01m, still pending.
      - eval_time: 24h5m
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts: []
      # Info fires after its 5m hold.
      - eval_time: 24h6m
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: info
              namespace: openshift-etcd-operator
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within one schedule interval.
              description: 'No existing EtcdBackup of backup policy "daily" completed successfully in the last 1d 0h 5m 59s, which is longer than one estimated schedule interval. The time is measured from the latest successful EtcdBackup of the policy that still exists, or from the policy creation if none exists. A warning also fires when this time exceeds two estimated schedule intervals.'
      - eval_time: 26h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: info
              namespace: openshift-etcd-operator
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within one schedule interval.
              description: 'No existing EtcdBackup of backup policy "daily" completed successfully in the last 1d 1h 59m 59s, which is longer than one estimated schedule interval. The time is measured from the latest successful EtcdBackup of the policy that still exists, or from the policy creation if none exists. A warning also fires when this time exceeds two estimated schedule intervals.'
      # Warning condition since 48h01m (pending); info keeps firing.
      - eval_time: 48h1m
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: info
              namespace: openshift-etcd-operator
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within one schedule interval.
              description: 'No existing EtcdBackup of backup policy "daily" completed successfully in the last 2d 0h 0m 59s, which is longer than one estimated schedule interval. The time is measured from the latest successful EtcdBackup of the policy that still exists, or from the policy creation if none exists. A warning also fires when this time exceeds two estimated schedule intervals.'
      - eval_time: 48h5m
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: info
              namespace: openshift-etcd-operator
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within one schedule interval.
              description: 'No existing EtcdBackup of backup policy "daily" completed successfully in the last 2d 0h 4m 59s, which is longer than one estimated schedule interval. The time is measured from the latest successful EtcdBackup of the policy that still exists, or from the policy creation if none exists. A warning also fires when this time exceeds two estimated schedule intervals.'
      # Warning fires after its own 5m hold; info keeps firing.
      - eval_time: 48h6m
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: info
              namespace: openshift-etcd-operator
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within one schedule interval.
              description: 'No existing EtcdBackup of backup policy "daily" completed successfully in the last 2d 0h 5m 59s, which is longer than one estimated schedule interval. The time is measured from the latest successful EtcdBackup of the policy that still exists, or from the policy creation if none exists. A warning also fires when this time exceeds two estimated schedule intervals.'
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within two schedule intervals.
              description: 'No existing EtcdBackup of backup policy "daily" completed successfully in the last 2d 0h 5m 59s, which is longer than two estimated schedule intervals. The time is measured from the latest successful EtcdBackup of the policy that still exists, or from the policy creation if none exists. This may prevent disaster recovery.'
      - eval_time: 50h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: info
              namespace: openshift-etcd-operator
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within one schedule interval.
              description: 'No existing EtcdBackup of backup policy "daily" completed successfully in the last 2d 1h 59m 59s, which is longer than one estimated schedule interval. The time is measured from the latest successful EtcdBackup of the policy that still exists, or from the policy creation if none exists. A warning also fires when this time exceeds two estimated schedule intervals.'
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within two schedule intervals.
              description: 'No existing EtcdBackup of backup policy "daily" completed successfully in the last 2d 1h 59m 59s, which is longer than two estimated schedule intervals. The time is measured from the latest successful EtcdBackup of the policy that still exists, or from the policy creation if none exists. This may prevent disaster recovery.'

  # The warning condition clears before its hold elapses: the never-succeeded
  # warning condition holds from 48h01m, backup b1 is created at 48h00m and
  # completes at 48h03m. At 48h02m info is firing and the warning is pending; the
  # completion clears both at 48h03m and the warning never fires.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "1+0x3000"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "86400+0x3000"
      - series: 'etcd_backup_info{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",etcd_backup_policy="daily",node="master-0",storage_type="PVC",storage_location="backup-pvc"}'
        values: "_x2880 1+0x120"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",status="Running"}'
        values: "_x2880 1+0x2 0+0x117"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",status="Completed"}'
        values: "_x2880 0+0x2 1+0x117"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",status="Failed"}'
        values: "_x2880 0+0x120"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1"}'
        values: "_x2880 172800+0x120"
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1"}'
        values: "_x2883 172980+0x117"
    alert_rule_test:
      - eval_time: 48h2m
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: info
              namespace: openshift-etcd-operator
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within one schedule interval.
              description: 'No existing EtcdBackup of backup policy "daily" completed successfully in the last 2d 0h 1m 59s, which is longer than one estimated schedule interval. The time is measured from the latest successful EtcdBackup of the policy that still exists, or from the policy creation if none exists. A warning also fires when this time exceeds two estimated schedule intervals.'
      # b1 completed: both severities clear at once.
      - eval_time: 48h3m
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts: []
      - eval_time: 48h6m
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts: []
      - eval_time: 50h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts: []

  # Recent Completed backup suppresses NoRecentSuccess for an old policy.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "1+0x3000"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "86400+0x3000"
      - series: 'etcd_backup_info{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",etcd_backup_policy="daily",node="master-0",storage_type="PVC",storage_location="backup-pvc"}'
        values: "1+0x3000"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",status="Completed"}'
        values: "1+0x3000"
      # completion near the end of the series window (≈49h) so age at 50h is ~1h.
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1"}'
        values: "176400+0x3000"
    alert_rule_test:
      - eval_time: 50h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts: []

  # Stale Completed backup: last success older than 2*interval → fire.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "1+0x3000"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="daily",uid="uid-1"}'
        values: "86400+0x3000"
      - series: 'etcd_backup_info{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",etcd_backup_policy="daily",node="master-0",storage_type="PVC",storage_location="backup-pvc"}'
        values: "1+0x3000"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1",status="Completed"}'
        values: "1+0x3000"
      # success at t=100s; at 50h age ≈50h > 48h threshold.
      - series: 'etcd_backup_completion_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup="b1",uid="b-uid-1"}'
        values: "100+0x3000"
    alert_rule_test:
      - eval_time: 50h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: info
              namespace: openshift-etcd-operator
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within one schedule interval.
              description: 'No existing EtcdBackup of backup policy "daily" completed successfully in the last 2d 1h 58m 20s, which is longer than one estimated schedule interval. The time is measured from the latest successful EtcdBackup of the policy that still exists, or from the policy creation if none exists. A warning also fires when this time exceeds two estimated schedule intervals.'
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup_policy: daily
              uid: uid-1
            exp_annotations:
              summary: Backup policy has no successful backup within two schedule intervals.
              description: 'No existing EtcdBackup of backup policy "daily" completed successfully in the last 2d 1h 58m 20s, which is longer than two estimated schedule intervals. The time is measured from the latest successful EtcdBackup of the policy that still exists, or from the policy creation if none exists. This may prevent disaster recovery.'

  # Weekly policy (interval=7d): info at 13d (above 1*interval, within
  # 2*interval = 14d); info and warning at 15d.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="weekly",uid="uid-2"}'
        values: "1+0x21600"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",instance="10.0.0.1:9090",etcd_backup_policy="weekly",uid="uid-2"}'
        values: "604800+0x21600"
    alert_rule_test:
      - eval_time: 312h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: info
              namespace: openshift-etcd-operator
              etcd_backup_policy: weekly
              uid: uid-2
            exp_annotations:
              summary: Backup policy has no successful backup within one schedule interval.
              description: 'No existing EtcdBackup of backup policy "weekly" completed successfully in the last 12d 23h 59m 59s, which is longer than one estimated schedule interval. The time is measured from the latest successful EtcdBackup of the policy that still exists, or from the policy creation if none exists. A warning also fires when this time exceeds two estimated schedule intervals.'
      - eval_time: 360h
        alertname: etcdBackupPolicyNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: info
              namespace: openshift-etcd-operator
              etcd_backup_policy: weekly
              uid: uid-2
            exp_annotations:
              summary: Backup policy has no successful backup within one schedule interval.
              description: 'No existing EtcdBackup of backup policy "weekly" completed successfully in the last 14d 23h 59m 59s, which is longer than one estimated schedule interval. The time is measured from the latest successful EtcdBackup of the policy that still exists, or from the policy creation if none exists. A warning also fires when this time exceeds two estimated schedule intervals.'
          - exp_labels:
              severity: warning
              namespace: openshift-etcd-operator
              etcd_backup_policy: weekly
              uid: uid-2
            exp_annotations:
              summary: Backup policy has no successful backup within two schedule intervals.
              description: 'No existing EtcdBackup of backup policy "weekly" completed successfully in the last 14d 23h 59m 59s, which is longer than two estimated schedule intervals. The time is measured from the latest successful EtcdBackup of the policy that still exists, or from the policy creation if none exists. This may prevent disaster recovery.'

  # Duplicate targets: two operator pods export the same policy (same UID) while
  # both are visible in the lookback window. Joins must deduplicate by logical
  # object instead of failing with many-to-many / duplicate-series errors, and
  # the policy must alert once per severity (not once per target): info at 26h
  # and 48h05m, info and warning from 48h06m. Backup b1 starts at 49h and
  # is still Running (no completion timestamp), so it is not a success.
  - interval: 1m
    input_series:
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup_policy="daily",uid="uid-1"}'
        values: "1+0x3359"
      - series: 'etcd_backup_policy_schedule_interval_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup_policy="daily",uid="uid-1"}'
        values: "86400+0x3359"
      - series: 'etcd_backup_info{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="b1",uid="b-uid-1",etcd_backup_policy="daily",node="master-0",storage_type="PVC",storage_location="backup-pvc"}'
        values: "_x2940 1+0x419"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="b1",uid="b-uid-1",status="Running"}'
        values: "_x2940 1+0x419"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="b1",uid="b-uid-1",status="Completed"}'
        values: "_x2940 0+0x419"
      - series: 'etcd_backup_status{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="b1",uid="b-uid-1",status="Failed"}'
        values: "_x2940 0+0x419"
      - series: 'etcd_backup_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-a",etcd_backup="b1",uid="b-uid-1"}'
        values: "_x2940 176400+0x419"
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.2:9090",pod="etcd-operator-b",etcd_backup_policy="daily",uid="uid-1"}'
        values: "1+0x3359"
