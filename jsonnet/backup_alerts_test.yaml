    input_series:
      - series: 'etcd_backup_policy_creation_timestamp_seconds{job="cluster-etcd-operator",namespace="openshift-etcd-operator",instance="10.0.0.1:9090",pod="etcd-operator-old",etcd_backup_policy="daily",uid="uid-old"}'
