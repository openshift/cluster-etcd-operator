apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:operator:etcd-operator
  annotations:
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  resourceNames:
  - pacemakerclusters.etcd.openshift.io
  verbs:
  - get
  - update
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - create
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  resourceNames:
  - system:openshift:operator:openshift-etcd-installer
  verbs:
  - get
- apiGroups:
  - config.openshift.io
  resources:
  - apiservers
  - clusteroperators
  - clusterversions
  - featuregates
  - infrastructures
  - networks
  - backups
  - pkis
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - console.openshift.io
  resources:
  - consolenotifications
  resourceNames:
  - pacemaker-cluster-degraded
  - pacemaker-troubleshooting
  verbs:
  - get
  - update
  - delete
- apiGroups:
  - console.openshift.io
  resources:
  - consolenotifications
  verbs:
  - create
- apiGroups:
  - etcd.openshift.io
  resources:
  - pacemakerclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - operator.openshift.io
  resources:
  - etcds
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - operator.openshift.io
  resources:
  - etcdbackups
  verbs:
  - get
  - list
  - watch
  - update
  - delete
- apiGroups:
  - operator.openshift.io
  resources:
  - etcds/status
  verbs:
  - patch
  - update
- apiGroups:
  - operator.openshift.io
  resources:
  - etcdbackups/status
  verbs:
  - update
